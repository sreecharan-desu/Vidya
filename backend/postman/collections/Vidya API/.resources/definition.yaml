$kind: collection
description: |-
  # Vidya API (student, `/api/v1`)

  Local: `http://localhost:4000` or your LAN IP from `npm start`.

  ## Setup
  1. Set `studentPassword` from the seed (`StudentDemo1!`) — **do not commit secrets**.
  2. Run **Auth → login** — `studentToken` / `refreshToken` auto-save.
  3. Set `chapterId`, `sectionId`, `classId`, `subjectId`, `schoolId`, `notificationId` from list responses
     (seed examples below).
  4. After editing YAML, run `npm run postman:export`.

  ## Surface
  Health, Auth, Students (onboarding, profile, avatar, settings, progress, bookmarks),
  Schools, Curriculum, Notifications.

  ## Docs
  - Swagger UI: `{{baseUrl}}/docs`
  - OpenAPI JSON: `{{baseUrl}}/docs-json`
