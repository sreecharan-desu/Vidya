$kind: http-request
name: POST /api/admin/materials
url: "{{baseUrl}}/api/admin/materials"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Sample Notes",
      "materialType": "notes",
      "classId": "class-8",
      "grade": 8,
      "subjectId": "c8-maths",
      "subjectName": "Mathematics",
      "chapterId": "c8-m-ch1",
      "chapterTitle": "Rational Numbers",
      "status": "draft",
      "notesContent": "Demo notes"
    }
order: 8200
