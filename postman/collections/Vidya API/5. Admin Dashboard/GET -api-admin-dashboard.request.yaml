$kind: http-request
name: GET /api/admin/dashboard
description: "Admin home KPIs: curriculum, users by role, materials stub, recentUsers."
url: "{{baseUrl}}/api/admin/dashboard?recentLimit=8"
method: GET
queryParams:
  - key: recentLimit
    value: "8"
    description: 1–50 recent users
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 2000
