$kind: http-request
name: POST /api/auth/login
description: Student login. Saves `studentToken`.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{studentEmail}}",
      "password": "{{studentPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        if (json.accessToken) pm.collectionVariables.set('studentToken', json.accessToken);
      }
    language: text/javascript
order: 1000
