$kind: http-request
name: GET /api/admin/dashboard/users
description: Paginated users for dashboard tables.
url: "{{baseUrl}}/api/admin/dashboard/users?limit=20&offset=0"
method: GET
queryParams:
  - key: role
    value: STUDENT
    disabled: true
    description: STUDENT | ADMIN | SUPER_ADMIN
  - key: limit
    value: "20"
  - key: offset
    value: "0"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 3000
