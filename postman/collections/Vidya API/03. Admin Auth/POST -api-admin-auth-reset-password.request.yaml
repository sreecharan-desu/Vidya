$kind: http-request
name: POST /api/admin/auth/reset-password
url: "{{baseUrl}}/api/admin/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{adminEmail}}",
      "otp": "{{otp}}",
      "newPassword": "{{adminPassword}}"
    }
order: 5000
