$kind: http-request
name: POST /api/admin/auth/change-password
url: "{{baseUrl}}/api/admin/auth/change-password"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "AdminDemo1!",
      "newPassword": "AdminDemo1!"
    }
order: 5600
