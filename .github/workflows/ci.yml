name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Generate Prisma client
        run: pnpm --dir packages/db exec prisma generate
        env:
          # Dummy URLs — generate does not need a live database
          DATABASE_URL: postgresql://vidya:vidya@localhost:5432/vidya?schema=public
          DIRECT_URL: postgresql://vidya:vidya@localhost:5432/vidya?schema=public

      - name: Typecheck
        run: pnpm exec tsc --noEmit
