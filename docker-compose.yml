services:
  postgres:
    image: postgres:17-alpine
    container_name: vidya-postgres
    environment:
      POSTGRES_USER: vidya
      POSTGRES_PASSWORD: vidya
      POSTGRES_DB: vidya
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidya -d vidya"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vidya-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    image: vidya-learning-app:dev
    build:
      context: .
      target: dev
    container_name: vidya-api
    restart: unless-stopped
    command: sh -c "pnpm --dir packages/db exec prisma generate && pnpm --dir packages/db exec prisma migrate deploy && pnpm --dir packages/db seed && pnpm dev:api"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://vidya:vidya@postgres:5432/vidya?schema=public
      DIRECT_URL: postgresql://vidya:vidya@postgres:5432/vidya?schema=public
      JWT_SECRET: dev-only-jwt-secret-change-me
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Vidya <noreply@vidya.local>"
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  student-mobile-web:
    image: vidya-learning-app:dev
    build:
      context: .
      target: dev
    container_name: vidya-student-mobile-web
    # --host lan + REACT_NATIVE_PACKAGER_HOSTNAME so Expo Go on a phone can load the bundle
    command: pnpm --dir apps/student-mobile exec expo start --web --host lan --port 8081
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Physical devices cannot use localhost — must be the Mac LAN IP (set by pnpm start)
      EXPO_PUBLIC_API_URL: http://${VIDYA_DEV_HOST:-127.0.0.1}:4000
      REACT_NATIVE_PACKAGER_HOSTNAME: ${VIDYA_DEV_HOST:-127.0.0.1}
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/student-mobile/node_modules
    depends_on:
      api:
        condition: service_healthy

  admin-mobile-web:
    image: vidya-learning-app:dev
    build:
      context: .
      target: dev
    container_name: vidya-admin-mobile-web
    command: pnpm --dir apps/admin-mobile exec expo start --web --host lan --port 8082
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: http://${VIDYA_DEV_HOST:-127.0.0.1}:4000
      REACT_NATIVE_PACKAGER_HOSTNAME: ${VIDYA_DEV_HOST:-127.0.0.1}
    ports:
      - "8082:8082"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin-mobile/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
